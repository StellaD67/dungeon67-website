media:
  input: assets/uploads
  output: /assets/uploads
content:
  - name: site
    label: Website-Inhalte
    type: file
    path: content/site.json
    format: json
    fields:
      - name: about
        label: Club
        type: object
        fields:
          - { name: title, label: Titel, type: string }
          - { name: description, label: Beschreibung, type: text }
      - name: offers
        label: Angebote
        type: object
        list: true
        fields:
          - { name: tag, label: Kategorie, type: string }
          - { name: title, label: Titel, type: string }
          - { name: description, label: Beschreibung, type: text }
          - { name: price, label: Preis, type: string }
      - name: events
        label: Events
        type: object
        list: true
        fields:
          - { name: date, label: Datum, type: string }
          - { name: title, label: Titel, type: string }
          - { name: description, label: Beschreibung, type: text }
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - { name: label, label: Bezeichnung, type: string }
          - { name: url, label: URL, type: string }
      - name: faq
        label: FAQ
        type: object
        list: true
        fields:
          - { name: question, label: Frage, type: string }
          - { name: answer, label: Antwort, type: text }
      - name: contact
        label: Kontakt
        type: object
        fields:
          - { name: name, label: Name, type: string }
          - { name: street, label: Strasse, type: string }
          - { name: city, label: Ort, type: string }
          - { name: email, label: E-Mail, type: string }
  - name: v3
    label: V3 – Aktionen, Packages & Verein
    type: file
    path: content/v3.json
    format: json
    fields:
      - { name: christmas_enabled, label: Weihnachtsaktion anzeigen, type: boolean }
      - { name: christmas_title, label: Aktionstitel, type: string }
      - { name: christmas_intro, label: Aktionseinleitung, type: text }
      - name: christmas
        label: Aktionskarten
        type: object
        list: true
        fields:
          - { name: title, label: Titel, type: string }
          - { name: description, label: Beschreibung, type: text }
          - { name: button, label: Buttontext, type: string }
          - { name: url, label: Buchungslink, type: string }
      - { name: packages_intro, label: Package-Einleitung, type: text }
      - { name: packages_url, label: Link zu Packages, type: string }
      - { name: rental_url, label: Link zu Mieten, type: string }
      - name: packages
        label: Packages
        type: object
        list: true
        fields:
          - { name: tag, label: Kategorie, type: string }
          - { name: title, label: Titel, type: string }
          - { name: description, label: Beschreibung, type: text }
          - { name: price, label: Preistext, type: string }
          - { name: url, label: Buchungslink, type: string }
      - { name: membership_title, label: Mitgliedschaftstitel, type: string }
      - { name: membership_text, label: Mitgliedschaftstext, type: text }
      - { name: membership_note, label: Hinweis zur Kostendeckung, type: text }
      - { name: email, label: Vereins-E-Mail, type: string }
